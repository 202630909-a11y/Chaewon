<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상점 차곡차곡 | 3학년 맞춤 상점 가이드</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-color: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --text-sub: #666666;
      --pastel-pink: #FFD1DC;
      --pastel-pink-sub: #FFF0F3;
      --pastel-blue: #CBE4F9;
      --pastel-blue-hover: #B5D8F7;
      --pastel-purple: #E2D4F9;
      --border-color: #EAECEF;
      --shadow-soft: 0 8px 24px rgba(149, 157, 165, 0.08);
      --radius-main: 16px;
      --radius-sub: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      line-height: 1.6;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card-bg);
      border-radius: var(--radius-main);
      padding: 36px 28px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-color);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2D3748;
      margin-bottom: 6px;
    }

    header h1 span {
      background: linear-gradient(120deg, var(--pastel-pink), var(--pastel-purple));
      padding: 2px 8px;
      border-radius: 6px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .penalty-card {
      background-color: var(--pastel-pink-sub);
      border: 1px solid #FFCCD5;
      border-radius: var(--radius-sub);
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .penalty-info {
      font-size: 0.9rem;
      color: #C53030;
      font-weight: 500;
    }

    .penalty-input-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #FFB5A7;
    }

    .penalty-input-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #4A5568;
    }

    .penalty-input-group input {
      width: 70px;
      border: none;
      outline: none;
      font-size: 1rem;
      font-weight: 700;
      color: #2D3748;
      text-align: right;
    }

    .penalty-status {
      font-size: 0.88rem;
      font-weight: 600;
      color: #2B6CB0;
      margin-left: auto;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2D3748;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      background-color: #FAFAFA;
      border-radius: var(--radius-sub);
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .period-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .period-btn {
      flex: 1;
      padding: 8px 0;
      border: 1px solid var(--border-color);
      background-color: #F1F3F5;
      color: var(--text-sub);
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .period-btn.active {
      background-color: var(--pastel-purple);
      color: #4A154B;
      border-color: #D6BCFA;
    }

    .timetable-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 480px) {
      .timetable-grid {
        grid-template-columns: 1fr;
      }
    }

    .timetable-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #F8F9FA;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .timetable-item span {
      font-size: 0.85rem;
      font-weight: 700;
      color: #718096;
      width: 42px;
    }

    .timetable-item select {
      padding: 6px 8px;
      font-size: 0.88rem;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--pastel-blue);
      color: #2B4C7E;
      border: none;
      border-radius: var(--radius-sub);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: var(--pastel-blue-hover);
    }

    .result-container {
      display: none;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 2px dashed var(--border-color);
    }

    .result-card {
      background-color: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: var(--radius-main);
      padding: 24px;
    }

    .result-card h2 {
      font-size: 1.2rem;
      color: #166534;
      margin-bottom: 16px;
    }

    .result-box {
      background-color: #FFFFFF;
      border-radius: var(--radius-sub);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #DCFCE7;
    }

    .result-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #15803D;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1rem;
      font-weight: 600;
      color: #1F2937;
    }

    .result-desc {
      font-size: 0.9rem;
      color: #4B5563;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 4px;
      margin-left: 6px;
    }

    .badge-vhigh { background-color: #BBF7D0; color: #166534; }
    .badge-high { background-color: #FEF08A; color: #854D0E; }
    .badge-normal { background-color: #E0E7FF; color: #3730A3; }
    .badge-low { background-color: #F3F4F6; color: #4B5563; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🌱 <span>상점 차곡차곡</span></h1>
    <p>3학년 전용 소선도 방지 & 맞춤 상점 획득 가이드</p>
  </header>

  <div class="penalty-card">
    <div class="penalty-info">
      ⚠ 벌점이 <strong>15점 이상</strong>이면 소선도 대상이 됩니다. 미리 상점을 모으세요!
    </div>
    <div class="penalty-input-group">
      <label for="currentPenalty">현재 내 벌점:</label>
      <input type="number" id="currentPenalty" value="10" min="0" max="30" oninput="updatePenaltyStatus()"> 점
      <div id="penaltyStatus" class="penalty-status">소선도까지 5점 남음</div>
    </div>
  </div>

  <div class="form-group">
    <div class="section-title">📍 학급 위치 선택</div>
    <select id="myClass">
      <option value="2">3학년 1반 (2층)</option>
      <option value="2">3학년 2반 (2층)</option>
      <option value="2">3학년 3반 (2층)</option>
      <option value="2">3학년 4반 (2층)</option>
      <option value="2">3학년 5반 (2층)</option>
      <option value="2">3학년 6반 (2층)</option>
      <option value="2">3학년 7반 (2층)</option>
      <option value="2">3학년 8반 (2층)</option>
      <option value="3">3학년 9반 (3층)</option>
      <option value="3">3학년 10반 (3층)</option>
    </select>
  </div>

  <div class="form-group">
    <div class="section-title">📅 오늘 시간표 입력</div>
    <div class="period-toggle">
      <button class="period-btn active" id="btn6" onclick="setPeriod(6)">6교시 수업일</button>
      <button class="period-btn" id="btn7" onclick="setPeriod(7)">7교시 수업일</button>
    </div>
    <div class="timetable-grid" id="timetableGrid"></div>
  </div>

  <div class="form-group">
    <div class="section-title">⏰ 상점 받으러 갈 시간대</div>
    <select id="freeTime">
      <option value="쉬는시간">쉬는 시간 (10분)</option>
      <option value="점심시간">점심 시간</option>
      <option value="방과후">방과 후</option>
    </select>
  </div>

  <button class="submit-btn" onclick="analyzeBestOption()">최적의 상점 가이드 확인하기 ✨</button>

  <div id="resultContainer" class="result-container">
    <div class="result-card">
      <h2>💡 오늘의 맞춤 상점 공략집</h2>
      
      <div class="result-box">
        <div class="result-label">오늘 가장 상점 받기 좋은 선생님</div>
        <div class="result-value" id="resTeacherName">-</div>
        <div class="result-desc" id="resTeacherInfo">-</div>
      </div>

      <div class="result-box">
        <div class="result-label">방문할 교무실 & 동선</div>
        <div class="result-value" id="resOfficeName">-</div>
        <div class="result-desc" id="resDistance">-</div>
      </div>

      <div class="result-box">
        <div class="result-label">추천 심부름 & 공략 멘트</div>
        <div class="result-value" id="resTask">-</div>
        <div class="result-desc" id="resScript" style="margin-top: 8px; font-style: italic; color: #2B6CB0;">-</div>
      </div>
    </div>
  </div>
</div>

<script>
  const subjects = ["수학", "과학", "영어", "국어", "체육", "창체", "가정", "기술", "역사", "사회", "스클", "미술", "한문"];
  
  // 엑셀 데이터를 바탕으로 업데이트된 선생님 데이터베이스
  const teacherDatabase = {
    "수학": { name: "김수학 선생님", floor: 2, office: "3학년 교무실 (2층)", freq: "높음", freqScore: 3, task: "수업 후 형성평가지/프린트 수거 및 교무실 전달", personality: "수업 후 정리 정돈을 중시하며, 수학 문제 질문을 반가워함" },
    "과학": { name: "박과학 선생님", floor: 2, office: "3학년 교무실 (2층)", freq: "매우 높음", freqScore: 4, task: "과학실 교구 정리 및 다음 수업 준비 보조", personality: "실험 교구 정리에 협조적인 학생에게 상점을 잘 주심" },
    "영어": { name: "이영어 선생님", floor: 2, office: "3학년 교무실 (2층)", freq: "보통", freqScore: 2, task: "영어 단어장 수거 및 제출 확인 보조", personality: "단어 시험지 채점 보조나 영어 질문 방문을 좋아함" },
    "국어": { name: "최국어 선생님", floor: 4, office: "생활교육부 (4층)", freq: "보통", freqScore: 2, task: "국어 수행평가 모음집 정리 및 제출 확인", personality: "예의 바르고 조용한 태도를 선호, 글씨체가 바른 학생에게 맡김" },
    "체육": { name: "강체육 선생님", floor: 1, office: "체육안전부 (1층)", freq: "매우 높음", freqScore: 4, task: "체육 수업 직후 공 및 운동 기구 수거/정리", personality: "체육관 및 운동장 기구 정리를 도우면 상점을 즉시 부여함" },
    "창체": { name: "윤창체 선생님", floor: 1, office: "대교무실 (1층)", freq: "높음", freqScore: 3, task: "동아리 활동지 수거 및 유인물 배부 보조", personality: "동아리활동 및 학급 행사 관련 심부름을 많이 시키심" },
    "가정": { name: "임가정 선생님", floor: 3, office: "1학년 교무실 (3층)", freq: "보통", freqScore: 2, task: "실습실 기구 정돈 및 뒷정리 도우미", personality: "실습실 청결 관리나 도구 정리를 적극적으로 돕는 학생 선호" },
    "기술": { name: "장기술 선생님", floor: 3, office: "1학년 교무실 (3층)", freq: "높음", freqScore: 3, task: "실습 재료 운반 및 정리 보조", personality: "기술실 공구 정리나 재료 운반을 돕는 학생을 좋아함" },
    "역사": { name: "한역사 선생님", floor: 2, office: "3학년 교무실 (2층)", freq: "보통", freqScore: 2, task: "역사 학습지 전달 및 판서 정리 지원", personality: "역사 사료 및 학습지 전달, 꼼꼼하게 정리하는 학생 선호" },
    "사회": { name: "송사회 선생님", floor: 2, office: "3학년 교무실 (2층)", freq: "높음", freqScore: 3, task: "수업 시각자료/지도 수거 및 교무실 전달", personality: "뉴스나 사회 이슈 질문에 친절하며 지도/자료 정리를 맡김" },
    "스클": { name: "오스클 선생님", floor: 1, office: "체육안전부 (1층)", freq: "매우 높음", freqScore: 4, task: "스포츠클럽 용품 운반 및 출석부 전달", personality: "스포츠 클럽 활동용 용품 관리와 인원 점검 도우미 축하" },
    "미술": { name: "신미술 선생님", floor: 1, office: "대교무실 (1층)", freq: "높음", freqScore: 3, task: "미술실 실습 재료 정리 및 학생 작품 수거", personality: "미술실 준비물 정리, 작품 게시판 부착을 돕는 학생 선호" },
    "한문": { name: "조한문 선생님", floor: 4, office: "생활교육부 (4층)", freq: "낮음", freqScore: 1, task: "한문 공책 수거 및 과제 검사 보조", personality: "한자 쓰기 과제 확인 및 정숙한 태도를 중요시함" }
  };

  let currentMaxPeriod = 6;

  window.onload = function() {
    renderTimetable(6);
    updatePenaltyStatus();
  };

  function setPeriod(num) {
    currentMaxPeriod = num;
    document.getElementById('btn6').classList.toggle('active', num === 6);
    document.getElementById('btn7').classList.toggle('active', num === 7);
    renderTimetable(num);
  }

  function renderTimetable(periods) {
    const grid = document.getElementById('timetableGrid');
    grid.innerHTML = '';
    const defaultList = ["수학", "영어", "체육", "과학", "국어", "사회", "역사"];

    for (let i = 1; i <= periods; i++) {
      const item = document.createElement('div');
      item.className = 'timetable-item';

      const label = document.createElement('span');
      label.innerText = `${i}교시:`;

      const select = document.createElement('select');
      select.id = `period_${i}`;

      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = sub;
        if (sub === defaultList[i - 1]) opt.selected = true;
        select.appendChild(opt);
      });

      item.appendChild(label);
      item.appendChild(select);
      grid.appendChild(item);
    }
  }

  function updatePenaltyStatus() {
    const val = parseInt(document.getElementById('currentPenalty').value) || 0;
    const status = document.getElementById('penaltyStatus');
    const remaining = 15 - val;

    if (remaining <= 0) {
      status.innerText = "🚨 위험! 소선도 대상입니다.";
      status.style.color = "#C53030";
    } else {
      status.innerText = `소선도까지 ${remaining}점 남음`;
      status.style.color = "#2B6CB0";
    }
  }

  function analyzeBestOption() {
    const studentFloor = parseInt(document.getElementById('myClass').value);
    const selectedTime = document.getElementById('freeTime').value;

    const todaySubjects = [];
    for (let i = 1; i <= currentMaxPeriod; i++) {
      const sub = document.getElementById(`period_${i}`).value;
      todaySubjects.push(sub);
    }

    let bestSubject = todaySubjects[0];
    let maxScore = -1;
    let minDistance = 99;

    todaySubjects.forEach(sub => {
      const t = teacherDatabase[sub];
      const dist = Math.abs(studentFloor - t.floor);
      
      if (t.freqScore > maxScore || (t.freqScore === maxScore && dist < minDistance)) {
        maxScore = t.freqScore;
        minDistance = dist;
        bestSubject = sub;
      }
    });

    const target = teacherDatabase[bestSubject];
    const distFloor = Math.abs(studentFloor - target.floor);

    let badgeClass = "badge-normal";
    if (target.freq === "매우 높음") badgeClass = "badge-vhigh";
    else if (target.freq === "높음") badgeClass = "badge-high";
    else if (target.freq === "낮음") badgeClass = "badge-low";

    document.getElementById('resTeacherName').innerHTML = 
      `${target.name} (${bestSubject}) <span class="badge ${badgeClass}">상점 빈도: ${target.freq}</span>`;
    
    document.getElementById('resTeacherInfo').innerText = `특징: ${target.personality}`;
    document.getElementById('resOfficeName').innerText = target.office;
    
    if (distFloor === 0) {
      document.getElementById('resDistance').innerText = `📍 우리 반과 같은 층! (도보 1분 이내로 가장 가깝습니다)`;
    } else {
      document.getElementById('resDistance').innerText = `📍 우리 반 계단 기준 ${distFloor}개 층 이동 필요`;
    }

    document.getElementById('resTask').innerText = target.task;
    document.getElementById('resScript').innerText = 
      `💬 추천 멘트: "${target.name}! 오늘 ${bestSubject} 수업 관련해서 ${selectedTime}에 제가 도와드릴 심부름이나 정리할 일 있을까요?"`;

    document.getElementById('resultContainer').style.display = 'block';
    document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
